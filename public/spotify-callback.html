<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyrio · Spotify</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3ecdc;color:#1e1b16;font:700 18px/1.4 system-ui,sans-serif;text-align:center}</style></head>
<body><p id="m">Connexion à Spotify…</p>
<script>
  // Cette petite fenêtre renvoie le code à Lyrio (la page d'origine reste ouverte), puis se ferme.
  const q = new URLSearchParams(location.search);
  const msg = { code: q.get('code') || '', state: q.get('state') || '', error: q.get('error') || '' };
  try { if (window.opener) window.opener.postMessage({ llSpotify: msg }, location.origin); } catch (e) {}
  document.getElementById('m').textContent = msg.error ? 'Connexion annulée. Vous pouvez fermer cette fenêtre.' : 'Connecté ! Retour sur Lyrio…';
  setTimeout(() => window.close(), 600);
</script></body></html>
