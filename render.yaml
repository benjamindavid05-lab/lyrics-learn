# Hébergement sur Render (https://render.com) : "New +" > "Blueprint" > choisir ce dépôt.
# À chaque `git push` sur main, le site se met à jour tout seul.
services:
  - type: web
    name: lyrics-learn
    runtime: node
    plan: free
    region: frankfurt          # serveur en Europe
    buildCommand: echo "rien à construire"
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY    # traduction contextuelle
        sync: false
      - key: GENIUS_TOKEN      # recherche de chansons
        sync: false
      - key: CONTACT_EMAIL     # affiché sur la page de confidentialité
        sync: false
      # À ajouter plus tard dans le tableau de bord si besoin : DEEPL_API_KEY, GEMINI_MODEL,
      # LIMIT_PER_HOUR, LIMIT_PER_DAY, LIMIT_GLOBAL_PER_DAY
